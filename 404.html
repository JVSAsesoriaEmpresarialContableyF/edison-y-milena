<!doctype html>

<head>
<meta charset="utf-8">

<meta name="robots" content="noindex">
<title>Edison &amp; Milena · Nuestra boda</title>
<meta name="theme-color" content="#F1ECF6">
<script>
  // Cualquier dirección equivocada lleva a la invitación.
  // En github.io la página vive en /<repositorio>/; se calcula para no caer en un bucle
  // cuando la dirección equivocada tiene varias carpetas (p. ej. /edison-y-milena/a/b).
  (function () {
    var partes = location.pathname.split('/').filter(Boolean);
    var base = /\.github\.io$/i.test(location.hostname) && partes.length ? '/' + partes[0] + '/' : './';
    location.replace(base);
  })();
</script>

  p { margin: 0; font-style: italic; font-size: 1.15rem; }
  a {
